# Local development services. Usage: docker compose up -d db
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rstar
      POSTGRES_PASSWORD: rstar
      POSTGRES_DB: rstar_one_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
volumes:
  pgdata:
