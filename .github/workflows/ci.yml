name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rstar
          POSTGRES_PASSWORD: rstar
          POSTGRES_DB: rstar_one_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rstar" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://rstar:rstar@localhost:5432/rstar_one_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rstar/shared build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @rstar/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
